user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # ── DNS resolver ────────────────────────────────────────────
    # Docker's embedded DNS at 127.0.0.11. Setting a resolver here
    # forces nginx to re-resolve the *variable-form* hostnames below
    # (e.g. http://frontend:3000 used as a variable in `proxy_pass`)
    # every 10 seconds instead of only at startup. This prevents the
    # "502 Bad Gateway" that would otherwise occur whenever an
    # upstream container (frontend / backend) is recreated and gets
    # a new internal Docker IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS Server ──────────────────────────────────────────

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL Certificate (self-signed — production use Let's Encrypt)
        ssl_certificate     /etc/nginx/certs/nod-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nod-selfsigned.key;

        # SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # IMPORTANT: upstream hostnames must be referenced as plain
        # strings inside `proxy_pass …` (with `resolver` directive
        # above) so that nginx re-evaluates the hostname via DNS on
        # each request rather than caching it at startup. This is the
        # fix that prevents 502 after `docker compose restart`.
        #
        # Format:    proxy_pass http://<service>:<port>;
        # NOT:       proxy_pass http://upstream_name;

        # Proxy to Next.js frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        # Proxy API requests to FastAPI backend
        # SSE alert stream — must never be buffered. Re-emit X-Accel-Buffering
        # so an upstream reverse proxy (e.g. the nod.esign.id front nginx) also
        # disables buffering, without that team changing their config. Standard
        # nginx honors this header out of the box. Longest-prefix match wins, so
        # this takes precedence over `location /api/` below.
        location /api/v1/alerts/stream {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Proxy WebSocket connections to FastAPI backend
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Auth endpoints
        location /auth/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # Next.js static assets (optimized caching)
        location /_next/static {
            proxy_pass http://frontend:3000;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 256;
        gzip_vary on;
    }
}
